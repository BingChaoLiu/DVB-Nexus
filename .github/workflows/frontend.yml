name: frontend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Frontend CI (SPEC-400 §11 AC-400-04, ticket #61): three jobs —
# lint/typecheck/test/build, the DTO drift lock (SPEC-400 §7.1), and the
# eight-step E2E smoke. The existing Python workflows are untouched.
jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned dependency set
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Component / interaction tests
        working-directory: frontend
        run: npm run test:run
      - name: Production build
        working-directory: frontend
        run: npm run build

  dto-drift-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project (the OpenAPI dump needs the real composition)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned frontend dependency set
        working-directory: frontend
        run: npm ci
      # SPEC-400 §7.1 drift lock: live dump → regenerate → diff → supplement
      # shrink check. Any SPEC-500 drift fails the job with the generating diff.
      - name: DTO drift lock (live OpenAPI dump vs committed generated types)
        working-directory: frontend
        run: npm run dto:check
      # Ticket #141 drift lock: the Phase 2 payloadKeys gen module vs the
      # registry's ordered same-source face (the render table's authority).
      - name: Payload-keys drift lock (registry face vs committed generated module)
        working-directory: frontend
        run: npm run payload-keys:check

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project (backend for the ASGI entry)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      # uvicorn ws="auto" needs a WebSocket library or every WS handshake is
      # refused (404) — TestClient-based tests never exercised real
      # handshakes, so this serving-side prerequisite is declared here.
      # Pinned <16: uvicorn 0.54's websockets implementation imports the
      # legacy API (removed in websockets 16).
      - name: Install WebSocket serving library (uvicorn ws=auto prerequisite)
        run: python -m pip install "websockets>=14,<16"
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned frontend dependency set
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: E2E smoke (shell + eight-step skeleton)
        working-directory: frontend
        run: npm run e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
