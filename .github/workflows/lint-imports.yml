name: lint-imports

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Enforce import contracts (ADR-0005 decision 4)
        run: lint-imports
