[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dvb-nexus"
version = "0.1.0"
description = "DVB-Nexus sandbox backend: MPEG-TS semantic core, simulation runtime, observation and diagnosis pipeline."
# No readme reference: repo README.md is currently UTF-16-encoded (pre-existing
# defect, reported to the delegator); setuptools reads it as UTF-8 and fails.
requires-python = ">=3.10"
# Runtime deps per ADR-0003 frozen stack. Pydantic v2 arrives with the
# SPEC-003 shared domain models (ticket #21): v2 API required
# (ConfigDict/StringConstraints), <3 guards against the next major.
# FastAPI arrives as a runtime dep with the SPEC-500 REST skeleton
# (ticket #24): app factory + error contract render through FastAPI
# (ADR-0003 frozen stack, Presentation/Application boundary per ADR-0005);
# pin kept identical to the dev-group entry added by ticket #22.
# uvicorn declares the documented run posture (src/api/README.md 部署姿态,
# app.py docstring): `uvicorn --factory api.app:create_app` — the #24
# acceptance evidence gap ("app 可启动") closed in review-fix #7. 0.30 is a
# current-generation floor; <1 guards against the next major.
dependencies = [
    "pydantic>=2,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "import-linter>=2.0,<3",
    # Test tooling (SPEC-505 Test Architecture, ticket #22). Runtime
    # dependencies stay empty at the M0 skeleton stage. fastapi/httpx2/
    # pydantic are mandated by the SPEC-505 §4 api_client fixture
    # (FastAPI test client + Pydantic DTO round-trip, ADR-0003 frozen stack).
    # httpx2: starlette TestClient's supported transport (httpx emits
    # StarletteDeprecationWarning since starlette ≥0.49).
    "pytest>=8,<9",
    "fastapi>=0.110,<1",
    "httpx2>=2,<3",
    "pydantic>=2.6,<3",
    # CI-workflow structural consistency checks (tests/integration/
    # test_ci_workflow_contract.py) keep the CI -m filters aligned with the
    # registered markers.
    "pyyaml>=6.0.1,<7",
]

# ---------------------------------------------------------------------------
# Pytest configuration (SPEC-505 §3/§5: four-layer tree, strict markers,
# explicit skip visibility). pytest.ini location from SPEC-505 §11 is a
# "suggested file" note, not normative; pyproject stays the single config
# home established by ticket #20.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# tests/_support is imported as a package (`tests._support.*`); rootdir on
# sys.path keeps imports working without cwd assumptions (Windows-first,
# ADR-0004).
pythonpath = ["."]
# --strict-markers: an unregistered marker is a hard collection failure
# (SPEC-505 §8 "markers 声明完备性检查"). -ra: skip reasons always surface
# in the summary (SPEC-505 §5 禁静默跳过).
addopts = "--strict-markers --strict-config -ra"
markers = [
    "unit: 纯函数/编解码/CRC/时钟/状态转换层——无 I/O、无墙钟（SPEC-505 §3）",
    "integration: Generator/TSRuntime、fault 过滤器、存储、TSDuck Adapter 真实子进程——真实/临时资源层（SPEC-505 §3）",
    "conformance: 加载 SPEC-506 已登记向量断言——只读向量层（SPEC-505 §3）",
    "e2e: 八步闭环 API 级全栈层 create→…→verify（SPEC-505 §3，ADR-0002）",
    "slow: 慢测试——本地默认跑、CI 夜间跑（SPEC-505 §5）",
    "tsduck: 需要 TSDuck CLI——缺失时 tsduck fixture 显式 skip，禁静默跳过（SPEC-505 §4/§5、#14）",
    "windows_only: Windows-first 断言——非 Windows 显式 skip，Windows CI 必跑（SPEC-505 §5、ADR-0004）",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Dependency boundaries (ADR-0005 decision 4 "模块划分 —— 11 包维持 + 目录融合版").
# Layer names only in code and docs; architecture-layer numbering is banned
# per CONTEXT.md (fidelity tiers keep their own names). Boundaries live only
# here in the lint layer.
#
# Encoding rule: each ADR bullet's stated dependency edges are the allowed set;
# everything else is forbidden (complement), plus the bullet's explicit bans.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = [
    "api",
    "application",
    "adapters",
    "domain",
    "ts",
    "faults",
    "simulation",
    "knowledge",
]
include_external_packages = true

# ADR-0005 D4-1: "ts 与 domain/* 纯净：不 import 任何上层包".
# ts has no stated outgoing edges, so it imports nothing else in the project.
[[tool.importlinter.contracts]]
name = "ts purity: imports no other project package (ADR-0005 decision 4)"
type = "forbidden"
source_modules = ["ts"]
forbidden_modules = [
    "api",
    "application",
    "faults",
    "simulation",
    "knowledge",
    "domain",
    "domain.*",
    "adapters",
    "adapters.*",
]

# ADR-0005 D4-1: domain packages do not import the Application/API layer
# (Presentation is the React frontend, not a Python package).
[[tool.importlinter.contracts]]
name = "domain purity: no Application/API imports (ADR-0005 decision 4)"
type = "forbidden"
source_modules = ["domain.*"]
forbidden_modules = ["api", "application"]

# ADR-0005 D4-2: "domain/* 不 import FastAPI/SQLite/文件系统/TSDuck CLI".
# External bans are root-level names (import-linter requirement):
#   FastAPI -> fastapi; SQLite -> sqlite3 + adapters.storage;
#   filesystem -> stdlib I/O markers os/shutil/glob/tempfile/pathlib
#   (os also covers os.path/os.environ);
#   TSDuck CLI -> adapters.tsduck (plus the whole adapters container).
[[tool.importlinter.contracts]]
name = "domain purity: no FastAPI/SQLite/filesystem/TSDuck adapter imports (ADR-0005 decision 4)"
type = "forbidden"
source_modules = ["domain.*"]
forbidden_modules = [
    "fastapi",
    "sqlite3",
    "os",
    "shutil",
    "glob",
    "tempfile",
    "pathlib",
    "adapters",
    "adapters.*",
]

# ADR-0005 D4-1: "ts 不 import tsduck（生成兜底由 simulation/application 调用，
# 防外部工具反向污染核心资产）". Encoded bidirectionally: the external tool
# must not contaminate TS Core and TS Core must not depend on it.
[[tool.importlinter.contracts]]
name = "ts and adapters.tsduck are mutually independent (ADR-0005 decision 4)"
type = "independence"
modules = ["ts", "adapters.tsduck"]

# ADR-0005 D4-3: "diagnosis 只消费 observation，不碰 TSDuck 进程、不解析原始 TS".
# knowledge is allowed: ADR-0005 decision 4 scope note has knowledge as static
# reference data "供诊断解释消费" (consumed by diagnosis explanations).
[[tool.importlinter.contracts]]
name = "diagnosis consumes only observation (plus knowledge reference data); never ts/faults/simulation/topology/adapters (ADR-0005 decision 4)"
type = "forbidden"
source_modules = ["domain.diagnosis"]
forbidden_modules = [
    "ts",
    "faults",
    "simulation",
    "domain.topology",
    "adapters",
    "adapters.*",
]

# ADR-0005 D4-3/D4-4: "api 不含 TS 二进制编码细节" and "api -> application".
# application is api's only stated dependency, so all other project packages
# are forbidden (TS binary encoding details live in ts/adapters and are thus
# unreachable from api).
[[tool.importlinter.contracts]]
name = "api depends only on application; no TS binary encoding details (ADR-0005 decision 4)"
type = "forbidden"
source_modules = ["api"]
forbidden_modules = [
    "ts",
    "faults",
    "simulation",
    "knowledge",
    "domain",
    "domain.*",
    "adapters",
    "adapters.*",
]

# ADR-0005 D4-4: "faults -> ts（FaultDefinition 应用到包模型）+ tsduck 接口
# （传输级路由）". Everything else is forbidden by complement; adapters.tsduck
# stays allowed, adapters.storage does not.
[[tool.importlinter.contracts]]
name = "faults depends only on ts and the tsduck adapter interface (ADR-0005 decision 4)"
type = "forbidden"
source_modules = ["faults"]
forbidden_modules = [
    "api",
    "application",
    "simulation",
    "knowledge",
    "domain",
    "domain.*",
    "adapters",
    "adapters.storage",
]

# ADR-0005 D4-4: "simulation -> ts/faults/adapters". Everything else is
# forbidden by complement — with one M3 exception ruled by the orchestrator
# (dispatch log on #15, resolves M0 #21 open question): ADR-0005 D4-5
# positively declares "observation 为统一事件交换接口", so simulation gains
# the edge to the single canonical event envelope (domain.observation) and
# may not invent a fourth envelope format. The complement contract cannot
# express a subpackage carve-out, so the other domain subpackages are
# enumerated explicitly (diagnosis, topology) in both bare and wildcard
# forms — whichever match semantics import-linter uses, both are covered.
# New domain subpackages must be added here; the bare `domain` root import
# stays unflagged (root __init__ holds no re-exports, enforced by review).
[[tool.importlinter.contracts]]
name = "simulation depends only on ts/faults/adapters plus the canonical observation envelope (ADR-0005 D4-4 + D4-5 hub, M3 ruling)"
type = "forbidden"
source_modules = ["simulation"]
forbidden_modules = [
    "api",
    "application",
    "knowledge",
    "domain.diagnosis",
    "domain.diagnosis.*",
    "domain.topology",
    "domain.topology.*",
]

# ADR-0005 D4-4: "application -> 全部" read as all packages except api
# (api -> application is the stated reverse edge; this closes the cycle).
[[tool.importlinter.contracts]]
name = "application never imports api (ADR-0005 decision 4 cycle guard)"
type = "forbidden"
source_modules = ["application"]
forbidden_modules = ["api"]

# ADR-0005 D4-5: "observation 为统一事件交换接口" — positive hub statement:
# any package may import domain.observation, so no outgoing-edge contract is
# added for it beyond the domain purity contracts above.
